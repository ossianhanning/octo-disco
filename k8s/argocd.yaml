apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: voyado-elevate-insights
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    repoURL: git@github.com:ossianhanning/octo-disco.git
    targetRevision: main
    path: k8s
    
  # Destination: Where to deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: default  # Change to your target namespace
  
  # Sync Policy: Automated deployment
  syncPolicy:
    automated:
      prune: true        # Delete resources when removed from Git
      selfHeal: true     # Auto-sync when cluster state drifts from Git
      allowEmpty: false
    syncOptions:
      - Validate=true
      - CreateNamespace=true  # Auto-create namespace if it doesn't exist
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences: []
  
  revisionHistoryLimit: 10
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: voyado
  namespace: argocd
spec:
  description: Voyado Elevate Insights Platform
  
  sourceRepos:
    - git@github.com:ossianhanning/octo-disco.git
  
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  
  namespaceResourceBlacklist:
    - group: ''
      kind: ResourceQuota
    - group: ''
      kind: LimitRange
