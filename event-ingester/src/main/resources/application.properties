# Application Configuration
spring.application.name=event-ingester

# Server Configuration
server.port=8080

# Exclude OpenTelemetry metric exporter to avoid version conflicts
spring.autoconfigure.exclude=io.opentelemetry.instrumentation.spring.autoconfigure.exporters.otlp.OtlpMetricExporterAutoConfiguration

# Enable Virtual Threads for async task executor
spring.threads.virtual.enabled=true

# Actuator Configuration - expose metrics and health
management.endpoints.web.exposure.include=health,metrics,prometheus,info
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Logging Configuration
logging.level.root=INFO
logging.level.com.voyado.ingester=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Tomcat Configuration for high concurrency
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.max-connections=10000

# Kafka Configuration
spring.kafka.bootstrap-servers=kafka.data.svc.cluster.local:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=1
spring.kafka.producer.retries=3
spring.kafka.producer.properties.linger.ms=10
spring.kafka.producer.properties.batch.size=32768

# Kafka Topics
kafka.topics.search-events=search-events
kafka.topics.product-view-events=product-view-events

# Application Info
info.app.name=Event Ingester
info.app.description=High-performance event ingester using Java 21 Virtual Threads
info.app.version=1.0.0
info.java.version=21

# OpenTelemetry / Jaeger Tracing
spring.application.name=event-ingester
otel.traces.exporter=otlp
otel.exporter.otlp.endpoint=http://jaeger.monitoring.svc.cluster.local:4317
otel.metrics.exporter=none
otel.logs.exporter=none
otel.resource.attributes=service.name=event-ingester,service.namespace=data
otel.instrumentation.spring-webmvc.enabled=true
otel.instrumentation.kafka.enabled=true
management.tracing.enabled=false
management.otlp.tracing.endpoint=http://jaeger.monitoring.svc.cluster.local:4317
