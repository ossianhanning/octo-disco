# Application
spring.application.name=kafka-clickhouse-consumer
server.port=8081
spring.threads.virtual.enabled=true

# Exclude OpenTelemetry metric exporter to avoid version conflicts
spring.autoconfigure.exclude=io.opentelemetry.instrumentation.spring.autoconfigure.exporters.otlp.OtlpMetricExporterAutoConfiguration

# Kafka Consumer Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka.data.svc.cluster.local:9092}
spring.kafka.consumer.group-id=clickhouse-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.max-poll-records=500

# Kafka Topics
kafka.topics.search-events=search-events
kafka.topics.product-view-events=product-view-events

# ClickHouse Configuration
clickhouse.host=${CLICKHOUSE_HOST:clickhouse.data.svc.cluster.local}
clickhouse.port=${CLICKHOUSE_PORT:8123}
clickhouse.database=${CLICKHOUSE_DATABASE:events}
clickhouse.user=${CLICKHOUSE_USER:default}
clickhouse.password=${CLICKHOUSE_PASSWORD:}

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.voyado.consumer=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# Telemetry/Trace logging
spring.application.name=kafka-clickhouse-consumer
otel.traces.exporter=otlp
otel.exporter.otlp.endpoint=http://jaeger.monitoring.svc.cluster.local:4317
otel.metrics.exporter=none
otel.logs.exporter=none
otel.resource.attributes=service.name=kafka-clickhouse-consumer,service.namespace=data
otel.instrumentation.kafka.enabled=true
management.tracing.enabled=false
management.otlp.tracing.endpoint=http://jaeger.monitoring.svc.cluster.local:4317
