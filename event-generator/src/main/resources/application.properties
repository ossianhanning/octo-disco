# Application
spring.application.name=event-generator
server.port=8082
spring.threads.virtual.enabled=true

# Event Ingester Configuration (run locally, defaults to NodePort)
ingester.base-url=${INGESTER_BASE_URL:http://192.168.23.132:30180}

# Generator Settings
generator.batch-size=${BATCH_SIZE:100}
generator.concurrent-requests=${CONCURRENT_REQUESTS:50}

# WebClient
spring.codec.max-in-memory-size=10MB

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# OpenTelemetry (Jaeger)
otel.exporter.otlp.endpoint=http://192.168.23.132:30317
otel.service.name=event-generator
otel.traces.exporter=otlp
otel.metrics.exporter=none

# Logging
logging.level.root=INFO
logging.level.com.voyado.generator=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# Application Info
info.app.name=Event Generator
info.app.description=Load testing tool for event ingestion (local development)
info.app.version=1.0.0
